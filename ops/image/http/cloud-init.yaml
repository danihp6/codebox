#cloud-config
# First boot only, passed as instance user-data: the image carries neither an identity nor a
# credential. cloud-init runs /usr/local/lib/codebox/cloud-init.sh, which reads the four Vault
# secrets through the instance principal and writes /etc/codebox/instance.env (0640
# root:codebox) and /etc/cloudflared. ${CB_INSTANCE_NAME} is substituted before the file is
# handed to the instance; no name and no secret is ever committed here.
hostname: ${CB_INSTANCE_NAME}
preserve_hostname: false
manage_etc_hosts: false
package_update: false
package_upgrade: false

# Ordering: the script runs at the end of the first boot, after networking, so the Vault read
# and the health probe have a route.
cloud_final_modules:
  - scripts-user
  - final-message

runcmd:
  - [bash, /usr/local/lib/codebox/cloud-init.sh]
