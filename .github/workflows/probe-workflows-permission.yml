name: probe / workflows permission

# Measurement for issue #11: which credential can write what. Four pushes, all to throwaway
# branches that are deleted at the end; nothing is merged.
#
#   A. CB_AGENT_TOKEN, plain file        → Contents: write on the PAT
#   B. CB_AGENT_TOKEN, workflow file     → Workflows: write on the PAT
#   C. GITHUB_TOKEN,   plain file        → the job's own token (permissions: contents: write)
#   D. GITHUB_TOKEN,   workflow file     → known to be impossible by design, measured anyway
#
# A green C with a red B is the #11 condition: the push credential needs a PAT carrying
# `Contents: read and write` **and** `Workflows: read and write`. The App installation is a
# third credential, used by the daemon at runtime, and no probe here measures it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CB_AGENT_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name codebox-bot
          git config user.email codebox-bot@users.noreply.github.com

      - name: A. CB_AGENT_TOKEN, plain file
        id: a
        continue-on-error: true
        env:
          BRANCH: probe/a-contents
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          printf 'probe\n' > probe.txt
          git add probe.txt
          git commit -m "probe: A contents with the PAT"
          git push --force origin "$BRANCH"
          git push origin --delete "$BRANCH"
          rm -f probe.txt
          git switch main

      - name: B. CB_AGENT_TOKEN, workflow file
        id: b
        continue-on-error: true
        env:
          BRANCH: probe/b-workflows
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          mkdir -p .github/workflows
          printf 'name: probe\non: workflow_dispatch\njobs:\n  noop:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: echo probe\n' > .github/workflows/probe.yml
          git add .github/workflows/probe.yml
          git commit -m "probe: B workflows with the PAT"
          git push --force origin "$BRANCH"
          git push origin --delete "$BRANCH"
          git switch main

      - name: C. GITHUB_TOKEN, plain file
        id: c
        continue-on-error: true
        env:
          BRANCH: probe/c-contents
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          printf 'probe\n' > probe-token.txt
          git add probe-token.txt
          git commit -m "probe: C contents with GITHUB_TOKEN"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$BRANCH"
          rm -f probe-token.txt
          git switch main

      - name: D. GITHUB_TOKEN, workflow file
        id: d
        continue-on-error: true
        env:
          BRANCH: probe/d-workflows
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          mkdir -p .github/workflows
          printf 'name: probe\non: workflow_dispatch\njobs:\n  noop:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: echo probe\n' > .github/workflows/probe.yml
          git add .github/workflows/probe.yml
          git commit -m "probe: D workflows with GITHUB_TOKEN"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "$BRANCH"

      - name: Verdict
        if: always()
        env:
          A: ${{ steps.a.outcome }}
          B: ${{ steps.b.outcome }}
          C: ${{ steps.c.outcome }}
          D: ${{ steps.d.outcome }}
        run: |
          {
            echo "| push | credential | outcome |"
            echo "| --- | --- | --- |"
            echo "| A. plain file | CB_AGENT_TOKEN | $A |"
            echo "| B. workflow file | CB_AGENT_TOKEN | $B |"
            echo "| C. plain file | GITHUB_TOKEN | $C |"
            echo "| D. workflow file | GITHUB_TOKEN | $D |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$A" != success ] && [ "$C" != success ]; then
            echo "RESULT: no credential in this job can write contents; nothing else is measurable."
            exit 1
          fi
          if [ "$B" = success ]; then
            echo "RESULT: the PAT writes workflow files; issue #11 is closed for the cycle."
            exit 0
          fi
          echo "RESULT: the PAT cannot write workflow files. Give CB_AGENT_TOKEN Contents: read and write + Workflows: read and write, then re-run this probe."
          exit 1
