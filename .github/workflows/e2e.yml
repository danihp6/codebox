name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Proves the namespace the next step runs in can reach loopback and nothing else: a
      # socket to any other address fails with ENETUNREACH, which is what the flow must survive.
      - name: No-network guard
        run: unshare -rn sh -c 'ip link set lo up && ip -brief address show lo'

      - name: Playwright
        run: unshare -rn sh -c 'ip link set lo up && npm run e2e -- --repeat-each=2'

      - name: Headless flow
        run: npm run e2e:unit
