name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without the leading v (a dispatch is always a dry run)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="$INPUT_VERSION"
          if [ "$EVENT_NAME" = "push" ]; then
            raw="$REF_NAME"
          fi
          if ! printf '%s' "$raw" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf '::error::%s is not v<major>.<minor>.<patch>\n' "${raw:-<empty>}"
            exit 1
          fi
          printf 'version=%s\n' "${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Stage the payload
        run: node scripts/release/stage.mjs --out .release/stage

      - name: Build the artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release/build.mjs \
            --stage .release/stage \
            --out .release/out \
            --version "$VERSION" \
            --built-at "$(git show -s --format=%cI HEAD)" \
            --commit "$(git rev-parse HEAD)" \
            --check-package-version

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/notes.mjs --version "$VERSION" --out .release/out/RELEASE-NOTES.md

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codebox-${{ steps.version.outputs.version }}
          path: .release/out
          if-no-files-found: error

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            ".release/out/codebox-$VERSION.tar.gz" \
            ".release/out/codebox-$VERSION.tar.gz.sha256" \
            --notes-file .release/out/RELEASE-NOTES.md
